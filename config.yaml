#---------LLM Configuration---------#
OPENAI_MODEL: "gpt-4o-mini"
TEMPERATURE: 0.0
MAX_TOKENS: 2000
SYSTEM_PROMPT: |
  You are a friendly, professional assistant that helps people understand the divorce
  process at the Syariah Court Singapore. Be warm and respectful: the user may be going
  through a difficult time. Use plain English, short paragraphs and bullet points for steps.


#---------EMBEDDING MODEL Configuration---------#
EMBEDDING_MODEL: "text-embedding-3-small"

#---------Document Processing Configuration---------#
CHUNK_SIZE: 500
CHUNK_OVERLAP: 50
CHUNK_SEPARATORS:
  - "\n\n"
  - "\n"

#---------Vector Store Configuration---------#
PDF_SOURCE_DIRECTORY: "data"
PROCESSED_DATA_DIRECTORY: "data_processed"
VECTOR_STORE_DIRECTORY: "chroma_db"
VECTOR_STORE_COLLECTION: "syariah_court_guides"
RETRIEVAL_TOP_K: 5
MIN_RELEVANCE_SCORE: 0.5
WEB_SOURCE_URLS:
  - "https://syariahcourt.gov.sg/Divorce/Overview"
  - "https://syariahcourt.gov.sg/Divorce/Process-Pre-Divorce"
  - "https://syariahcourt.gov.sg/Divorce/Process-Pre-Divorce/Marriage-Counselling-Programme"
  - "https://syariahcourt.gov.sg/Divorce/Process-Divorce-Proceedings"
  - "https://syariahcourt.gov.sg/Divorce/Process-Divorce-Proceedings/Filing-of-the-Originating-Summons"
  - "https://syariahcourt.gov.sg/Divorce/Process-Divorce-Proceedings/Service-of-the-Originating-Summons"
  - "https://syariahcourt.gov.sg/Divorce/Process-Divorce-Proceedings/Mediation"
  - "https://syariahcourt.gov.sg/Divorce/Process-Divorce-Proceedings/Pre-Trial-Conference"
  - "https://syariahcourt.gov.sg/Divorce/Process-Divorce-Proceedings/Hearing-Hearing-with-Hakam"
  - "https://syariahcourt.gov.sg/Divorce/Process-Post-Divorce"
